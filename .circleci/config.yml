version: 2.1

jobs:
  build:
    docker:
      - image: cimg/rust:latest
    steps:
      - checkout
      - run: cargo build --release
      - run: cargo test

  docker-build-amd64:
    docker:
      - image: docker:latest
    steps:
      - setup_remote_docker
      - checkout
      - run:
          name: Build AMD64 Docker image
          command: |
            docker build -t rekv:latest-amd64 .

  docker-build-armv7:
    docker:
      - image: docker:latest
    steps:
      - setup_remote_docker
      - checkout
      - run:
          name: Build ARMv7 Docker image
          command: |
            docker build -f Dockerfile.rpi-armv7 -t rekv:latest-armv7 .

workflows:
  version: 2
  build-and-test:
    jobs:
      - build
      - docker-build-amd64:
          requires:
            - build
      - docker-build-armv7:
          requires:
            - build
