version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rekv:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - config-data:/var/lib/myservice
    environment:
      - REKV_CONFIG_PATH=/var/lib/myservice/state.json
      - REKV_REDIS_URL=redis://redis:6379
      - REKV_REDIS_CHANNEL=rekv:config:updates
      - REKV_BIND_ADDR=0.0.0.0:8080
      - RUST_LOG=info
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  config-data:
