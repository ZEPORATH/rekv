syntax = "proto3";

package rekv;

service RekvService {
  // Query configuration by XPath-like path
  rpc Get(GetRequest) returns (GetResponse);

  // Set configuration value at an XPath-like path
  rpc Set(SetRequest) returns (SetResponse);

  // Watch for configuration changes at an XPath-like path in real-time
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message GetRequest {
  string path = 1;
}

message GetResponse {
  bool found = 1;
  string json_value = 2;
  uint32 match_count = 3;
}

message SetRequest {
  string path = 1;
  string json_value = 2;
}

message SetResponse {
  bool success = 1;
  string error = 2;
  uint32 affected_count = 3;
  repeated string affected_paths = 4;
}

message WatchRequest {
  string path = 1;
}

message WatchEvent {
  string path = 1;
  string old_value = 2;
  string new_value = 3;
  uint64 timestamp_ms = 4;
}
