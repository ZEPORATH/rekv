syntax = "proto3";

package rekv;

option go_package = "github.com/raut/rekv/clients/go/proto;rekvpb";

service RekvService {
  // Runtime-typed CRUD operation used by language clients.
  rpc Call(RpcCallRequest) returns (RpcCallResponse);

  // Query configuration by XPath-like path
  rpc Get(GetRequest) returns (GetResponse);

  // Set configuration value at an XPath-like path
  rpc Set(SetRequest) returns (SetResponse);

  // Watch for configuration changes at an XPath-like path in real-time
  rpc Watch(WatchRequest) returns (stream WatchEvent);
}

message RpcCallRequest {
  uint64 id = 1;
  string method = 2;
  string path = 3;
  // JSON-encoded ConfigValue envelope; empty for methods without a value.
  string json_value = 4;
}

message RpcCallResponse {
  uint64 id = 1;
  bool ok = 2;
  // JSON-encoded typed result.
  string result_json = 3;
  string error_code = 4;
  string error_message = 5;
}

message GetRequest {
  string path = 1;
}

message GetResponse {
  bool found = 1;
  string json_value = 2;
  uint32 match_count = 3;
}

message SetRequest {
  string path = 1;
  string json_value = 2;
}

message SetResponse {
  bool success = 1;
  string error = 2;
  uint32 affected_count = 3;
  repeated string affected_paths = 4;
}

message WatchRequest {
  string path = 1;
}

message WatchEvent {
  string path = 1;
  string old_value = 2;
  string new_value = 3;
  uint64 timestamp_ms = 4;
}
